[advisories]
version = 2
unmaintained = "all"
yanked = "deny"
# Unmaintained, not a vulnerability, and no safe upgrade is available.
# The YAML parser migration is tracked separately.
ignore = ["RUSTSEC-2024-0449"]

[licenses]
version = 2
allow = ["MIT", "Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib", "CC0-1.0", "BSL-1.0", "CDLA-Permissive-2.0"]
confidence-threshold = 0.95

[bans]
# Compatible dependency graphs can include parallel major versions.
multiple-versions = "allow"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
