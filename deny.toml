[advisories]
version = 2
unmaintained = "all"
yanked = "deny"
ignore = [
  # Unmaintained, not a vulnerability, and no safe upgrade is available.
  # The YAML parser migration is tracked separately.
  "RUSTSEC-2024-0449",
  # Unmaintained chrono 0.4.45 (not a vulnerability, no safe upgrade available).
  # Required unconditionally by upstream oauth2 5.0.0 (also via rmcp 3.12.0)
  # and octocrab 0.54.9; instrukt itself uses jiff. Removal once upstream SDKs
  # migrate off chrono is tracked in todo `retire-chrono-advisory-ignore`.
  "RUSTSEC-2026-0543",
  # Unmaintained basic-toml 0.1.10 (not a vulnerability, no safe upgrade available)
  # and proc-macro-error2 2.0.1 (build-time proc-macro only; age 0.12.1 introduces
  # vulnerable crypto-bigint 0.5.5 / RUSTSEC-2026-0387). Required unconditionally
  # by upstream age 0.11.5 via i18n-embed-fl / i18n-config.
  # Removal tracked in `instrukt-home-backup` deferrals.
  "RUSTSEC-2026-0374",
  "RUSTSEC-2026-0173",
]

[licenses]
version = 2
allow = ["MIT", "Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib", "CC0-1.0", "BSL-1.0", "CDLA-Permissive-2.0"]
confidence-threshold = 0.95

[bans]
# Compatible dependency graphs can include parallel major versions.
multiple-versions = "allow"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
