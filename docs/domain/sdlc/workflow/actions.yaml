effects:
  record.refresh:
    command: instrukt todo show {slug}
  git.fetch-main:
    command: git fetch origin main
    done_when:
      any:
      - exists: build.start_base_sha
      - equals:
        - setup.handoff_confirmed
        - true
  git.merge-main:
    command: git merge origin/main --no-edit --no-overwrite-ignore
    done_when:
      any:
      - exists: build.start_base_sha
      - equals:
        - setup.handoff_confirmed
        - true
  branch.publish:
    command: git push --force-with-lease origin HEAD:{slug}
    done_when:
      same:
      - worktree.head
      - remote.head
  worktree.remove:
    command: git worktree remove {worktree.path}
    done_when:
      not:
        exists: worktree.exists
  role-branch.remove:
    command: git branch -d {role_branch.name}
    done_when:
      not:
        exists: role_branch.exists
