# Commands are configured obligations, not evaluator side effects.
# A todo attempt command reserves facts and returns the native assignment.
# Delegate through the runtime instruction rendered by @config; immediately record
# todo bind with the native child id and workspace/base evidence. No action starts
# a runtime through instrukt. Native child results wake their parent directly.
# Work workers use shared isolation in the orchestrator's one todo worktree.
# Preparation writers/reviewers share their separate <slug>/prepare worktree. Approved docs integrate before work starts.
# One outstanding workspace-role attempt is the workflow's single admission.
# Reuse only active attempts; stamps release them atomically at the clean shared head.
# The orchestrator routes all workspace effects to the admitted child and coordinates only.
# Cleanup removes the one todo worktree after delivery, preserving thread records.
# Resolve main to the actual canonical default branch. Stop on failure; re-derive after mutation.
# Render the brief as UTF-8 stdin for --brief -, never interpolate prose into shell text.
# Supply the rendered assignment to native delegation as structured text.
# Preserve the recorded shared workspace through @config: runtime.dispatch.
# Bind the returned native identity and matching workspace/base evidence.
# Serialize a SHA list as space-separated SHAs in the single --args argument.
# Placeholders may name facts or configuration paths, resolved as config get does.
# Delivered worktree cleanup follows confirmed delivery and claim release.
draft-prd:
  command: instrukt todo attempt {slug} --role intaker --procedure sdlc/procedure/lifecycle/prepare/intake --args {slug} --brief -
  template: templates/draft-prd.md
