effects:
  record.refresh:
    command: instrukt todo show {slug}
  branch.publish:
    command: git push --force-with-lease origin HEAD
    done_when:
      same:
      - worktree.head
      - remote.head
  branch.remove:
    command: git branch -d {branch.name}
    done_when:
      not: {exists: branch.head}
  remote_branch.remove:
    command: git push origin --delete {branch.name}
    done_when:
      not: {exists: remote.head}
  worktree.remove:
    command: git worktree remove {worktree.path}
    done_when:
      not:
        exists: worktree.exists

