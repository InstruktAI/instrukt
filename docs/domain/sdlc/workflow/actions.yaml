# Commands are configured obligations, not evaluator side effects.
# A sessions.run command is used only after record lookup/alive requires a start;
# Workspace-role reuse first requires an active, unreleased attempt, then an
# available recorded session. Send follow-ups only within that attempt. After
# release, start the next attempt at the current todo head, or use the explicit
# recover-attempt source for a recovery builder. Pending starts and handoffs
# remain outstanding and block another workspace-role dispatch.
# Run Git effects in the concerned attempt: setup for build admission, the active
# dispatched role for workspace work, retained finalizer for readiness. Cleanup
# enumerates every retained attempt path, then role branch, from the project checkout.
# Resolve main to the actual canonical default branch. Stop on failure; re-derive after mutation.
# Render the brief as UTF-8 stdin for --brief -, never interpolate prose into shell text.
# For sessions.send, pass the rendered brief as one argument through an argv API
# or correct shell quoting; never substitute its raw bytes into command text.
# Serialize a SHA list as space-separated SHAs in the single --args argument.
# Placeholders may name facts or configuration paths, resolved as config get does.
# Cleanup enumerates sessions.bound only after claim.held is confirmed false.
