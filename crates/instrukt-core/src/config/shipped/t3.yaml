# The runtime entry instrukt ships for T3 Code
# (`project/instrukt/spec/feature/runner/session-continuity`, "Shipped T3
# Code entry"). It is configuration only: the sessions facade drives it
# through the same verbs as an entry a developer maps.
#
# Command verbs run `t3 thread` on the computer that runs the T3 server.
# Each multi-line template defines a shell function and ends with its
# name, so the call's inputs, appended as positional parameters, become
# the function's arguments. Shell variables are written `$name`, never
# with braces, which configuration interpolation would read as its own.
name: t3
session_id_env: T3CODE_THREAD_ID
start: |-
  instrukt_t3_start() {
    if [ -z "$INSTRUKT_WORKTREE" ]; then
      t3 thread start . "$1"
      return
    fi
    base=$(git symbolic-ref --quiet --short refs/remotes/origin/HEAD) || {
      echo "the project names no default branch (origin/HEAD), so no worktree can be based on it" >&2
      return 1
    }
    base=$(printf '%s' "$base" | sed 's|^origin/||')
    id=$(t3 thread start --worktree "$base" --branch "$INSTRUKT_WORKTREE" . "$1") || return 1
    printf '%s\n' "$id"
    tries=0
    while [ "$tries" -lt 60 ]; do
      path=$(t3 thread show --json --messages 0 "$id" | sed -n 's/.*"worktreePath":"\([^"]*\)".*/\1/p')
      if [ -n "$path" ]; then
        printf '%s\n' "$path"
        return 0
      fi
      tries=$((tries + 1))
      sleep 1
    done
    echo "thread $id reported no worktree path" >&2
    return 1
  }
  instrukt_t3_start
send: t3 thread send {runtime.session_id}
alive: |-
  instrukt_t3_alive() {
    if ! out=$(t3 thread show --json --messages 0 {runtime.session_id} 2>&1); then
      case "$out" in
        *"is no longer available"*) echo gone; return 0 ;;
      esac
      printf '%s\n' "$out" >&2
      return 1
    fi
    case "$out" in
      *'"archived":true'*) echo gone; return 0 ;;
    esac
    case "$out" in
      *'"pendingRequestCount":0,'*) ;;
      *'"pendingRequestCount":'*) echo needs-input; return 0 ;;
    esac
    status=$(printf '%s\n' "$out" | tr ',' '\n' | sed -n 's/^"status":"\([a-z_]*\)"$/\1/p' | head -n 1)
    case "$status" in
      preparing|queued|starting|running) echo running ;;
      waiting) echo needs-input ;;
      idle|completed) echo ended ok ;;
      failed|interrupted|cancelled|rolled_back) echo ended failed ;;
      *) echo "T3 reported a thread status instrukt does not know: '$status'" >&2; return 1 ;;
    esac
  }
  instrukt_t3_alive
conversation: t3 thread show --messages 100 {runtime.session_id}
history:
  show: t3 thread show --messages 100
  search:
    kind: agent
    instruction: Search T3's threads for the text below with the T3 thread search tool (`t3_thread_search`), and read the thread ids it names; `instrukt sessions history show <id>` shows one of them.
end:
  kind: agent
  instruction: Settle T3 thread `{runtime.session_id}` with the T3 thread organize tool (`t3_thread_organize`, action `settle`).
end_self:
  kind: agent
  instruction: Settle this thread with the T3 thread organize tool (`t3_thread_organize`, action `settle`), naming no thread. T3 applies it when this turn ends, so make it the last thing you do.
