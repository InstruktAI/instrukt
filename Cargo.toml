[workspace]
resolver = "3"
members = [
    "crates/instrukt-cli",
    "crates/instrukt-core",
    "crates/instrukt-blueprint",
    "crates/instrukt-runner",
    "crates/instrukt-todos",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/InstruktAI/instrukt"

[workspace.dependencies]
jsonwebtoken = "=9.3.1"
instrukt-core = { path = "crates/instrukt-core", version = "0.1.0" }
instrukt-blueprint = { path = "crates/instrukt-blueprint", version = "0.1.0" }
instrukt-runner = { path = "crates/instrukt-runner", version = "0.1.0" }
instrukt-todos = { path = "crates/instrukt-todos", version = "0.1.0" }
instrukt-ai-logging = "=0.10.0"

anyhow = "1"
base64 = "0.23"
tungstenite = "0.28"
url = "2"
clap = { version = "4", features = ["derive", "wrap_help"] }
hex = "0.4"
hmac = "=0.12.1"
form_urlencoded = "=1.2.2"
dotenvy = "=0.15.7"
indexmap = { version = "2", features = ["serde"] }
jiff = { version = "0.2", features = ["serde"] }
redis = { version = "=1.8.1", default-features = false, features = ["streams", "script", "tls-rustls", "tls-rustls-webpki-roots"] }
regex = "1"
notify = { version = "=8.2.2", default-features = false, features = ["macos_kqueue"] }
rustix = { version = "1", features = ["process"] }
signal-hook = "0.3"
rusqlite = { version = "0.41", features = ["bundled", "functions", "serialize", "fallible_uint"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml_ng = "0.10"
sha2 = "=0.10.9"
tempfile = "3"
thiserror = "2"
tracing = "0.1"
ureq = "3"
walkdir = "2"

# test-only
assert_cmd = "2"
insta = { version = "1", features = ["yaml", "json"] }
predicates = "3"
proptest = "1"
tiny_http = "=0.12.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
print_stdout = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
