# The checks a commit's content needs (project/instrukt/policy/testing). Each
# check's `files` pattern is the one place that says which files it applies
# to. The framework passes a check the matching files that remain in the
# commit and never a path the commit deletes or moves away; every check
# therefore always starts, through scripts/commit-check.py, which adds those
# removed paths by the same pattern and runs the check's command only when a
# matching file was added, changed, renamed or deleted. The pipeline runs every
# check over every file. No check here runs the functional tests: they run in
# the pipeline. Document and configuration checks build nothing: they run an
# instrukt that is already there (scripts/instrukt-for-checks). Python scripts
# are linted and type-checked by the framework's own hooks for ruff and mypy,
# at the commits their tags name. `make hooks` installs them; a commit never
# does and is refused without them (scripts/commit-checks.sh). A commit that
# only removes a Python script leaves them nothing to read. The Rust check takes the shared target directory's lock
# (scripts/with-build-lock.sh) and builds only the crates the commit touches or
# whose unit tests read what it touches, and those that depend on them.
default_install_hook_types: [pre-commit]
repos:
  - repo: local
    hooks:
      - id: docs-validate
        name: document validation
        files: &documents ^docs/
        entry: scripts/commit-check.py
        args: [--pattern, *documents, --run, scripts/instrukt-for-checks docs validate, --]
        language: system
        always_run: true
        require_serial: true
      - id: shellcheck
        name: shellcheck
        files: &shell ^(scripts/[^/]+\.sh|scripts/dev-instrukt|scripts/instrukt-for-checks|\.githooks/[^/]+)$
        entry: scripts/commit-check.py
        args: [--pattern, *shell, --run, shellcheck -x, --takes-files, --]
        language: system
        always_run: true
        require_serial: true
      # The committed layer alone, under a throwaway machine layer: what this
      # computer's own configuration says does not decide a commit.
      - id: config-validate
        name: configuration validation
        files: &configuration ^instrukt\.yaml$
        entry: scripts/commit-check.py
        args: [--pattern, *configuration, --run, scripts/instrukt-for-checks --script scripts/check-committed-config.sh, --]
        language: system
        always_run: true
        require_serial: true
      # Everything a crate is built from and everything its unit tests read:
      # every file of a crate, the files compiled into the program and the
      # snapshots its unit tests read among them; the two inputs outside the
      # crates' folders, the shared test support and the workflow flavor (a
      # document too), whose readers scripts/rust-crates.py names; and the
      # workspace's manifest, lock file and toolchain and clippy configuration.
      - id: cargo-fmt
        name: cargo fmt
        files: &rust ^(crates/|tests/support/|docs/domain/sdlc/workflow/|Cargo\.(toml|lock)$|rust-toolchain\.toml$|clippy\.toml$)
        entry: scripts/commit-check.py
        args: [--pattern, *rust, --run, cargo fmt --all -- --check, --]
        language: system
        always_run: true
        require_serial: true
      - id: cargo-clippy-and-unit-tests
        name: cargo clippy and colocated unit tests of the crates reached
        files: *rust
        entry: scripts/commit-check.py
        args: [--pattern, *rust, --run, scripts/with-build-lock.sh scripts/check-rust.sh, --takes-files, --with-removed, --]
        language: system
        always_run: true
        require_serial: true
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 2700fd5671c633760d912769c041bfcde2b9a01b  # frozen: v0.15.22
    hooks:
      - id: ruff-check
        name: Python lint (ruff)
        files: &python ^scripts/[^/]+\.py$
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: a66e98df7b4aeeb3724184b332785976d062b92e  # frozen: v1.19.1
    hooks:
      - id: mypy
        name: Python type check (mypy, strict)
        files: *python
        args: [--strict, --scripts-are-modules]
